<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 640" fill="none">
  <defs>
    <linearGradient id="bronzeBarrel" x1="200" y1="180" x2="860" y2="420" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E5B94E" />
      <stop offset="55%" stop-color="#C99A2E" />
      <stop offset="100%" stop-color="#7D5818" />
    </linearGradient>
  </defs>
  <!-- Ground shadow under cannon carriage -->
  <ellipse cx="440" cy="500" rx="340" ry="68" fill="#1F1A17" fill-opacity="0.32" />

  <!-- Wooden gun carriage stepped cheeks (terracotta/muted wood) -->
  <path
    d="M140 470 L560 470 L560 350 L470 350 L470 390 L380 390 L380 425 L140 425 Z"
    fill="#A84825"
    stroke="#1F1A17"
    stroke-width="8"
  />

  <!-- Bronze cannon barrel (tilted upward toward the river) -->
  <g transform="rotate(-16 460 330)">
    <!-- Cascabel knob at breech -->
    <circle cx="170" cy="330" r="32" fill="#7D5818" />
    <!-- Main tapered bronze tube -->
    <path
      d="M195 274 L820 296 L820 364 L195 386 Z"
      fill="url(#bronzeBarrel)"
      stroke="#1F1A17"
      stroke-width="8"
    />
    <!-- Decorative bronze reinforcement rings -->
    <rect x="295" y="272" width="22" height="116" rx="6" fill="#F6EFE4" fill-opacity="0.45" />
    <rect x="495" y="278" width="20" height="104" rx="6" fill="#F6EFE4" fill-opacity="0.45" />
    <rect x="695" y="286" width="18" height="88" rx="6" fill="#F6EFE4" fill-opacity="0.45" />
    <!-- Muzzle swell -->
    <ellipse cx="826" cy="330" rx="18" ry="44" fill="#C99A2E" stroke="#1F1A17" stroke-width="8" />
  </g>

  <!-- Heavy spoked carriage wheel + iron rim -->
  <circle cx="485" cy="455" r="105" fill="#5E5148" stroke="#1F1A17" stroke-width="16" />
  <circle cx="485" cy="455" r="76" fill="#F6EFE4" fill-opacity="0.15" stroke="#C99A2E" stroke-width="10" />
  <line x1="485" y1="350" x2="485" y2="560" stroke="#1F1A17" stroke-width="12" />
  <line x1="380" y1="455" x2="590" y2="455" stroke="#1F1A17" stroke-width="12" />
  <circle cx="485" cy="455" r="26" fill="#C99A2E" stroke="#1F1A17" stroke-width="8" />

  <!-- Stacked iron cannonballs beside carriage -->
  <circle cx="215" cy="515" r="32" fill="#1F1A17" />
  <circle cx="280" cy="515" r="32" fill="#1F1A17" />
  <circle cx="248" cy="462" r="32" fill="#1F1A17" />
</svg>
