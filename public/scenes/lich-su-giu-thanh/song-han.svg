<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 440" fill="none">
  <defs>
    <linearGradient id="song-han-water" x1="480" y1="60" x2="480" y2="385" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#4A809D" />
      <stop offset="28%" stop-color="#2B6280" />
      <stop offset="68%" stop-color="#1E4D6A" />
      <stop offset="100%" stop-color="#15374E" />
    </linearGradient>
    <linearGradient id="song-han-far-bank" x1="480" y1="30" x2="480" y2="120" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E7D4AE" />
      <stop offset="100%" stop-color="#B99659" />
    </linearGradient>
    <linearGradient id="song-han-near-bank" x1="480" y1="305" x2="480" y2="415" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#8C6D3E" />
      <stop offset="35%" stop-color="#CAA464" />
      <stop offset="100%" stop-color="#EAD8B3" />
    </linearGradient>
    <linearGradient id="song-han-glint" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#FFF9EB" stop-opacity="0" />
      <stop offset="50%" stop-color="#FFF9EB" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#FFF9EB" stop-opacity="0" />
    </linearGradient>
    <pattern id="song-han-ripple-pat" width="96" height="48" patternUnits="userSpaceOnUse">
      <path d="M8 16 Q26 12, 44 16 T80 16" stroke="#8CC2DA" stroke-opacity="0.16" stroke-width="2" stroke-linecap="round" />
      <path d="M22 34 Q42 30, 62 34 T94 34" stroke="#F6EFE4" stroke-opacity="0.12" stroke-width="1.5" stroke-linecap="round" />
    </pattern>
  </defs>

  <!-- Far sandy riverbank (upper, slightly hazed) -->
  <path d="M0 78 C210 38, 430 112, 680 72 C805 52, 900 72, 960 88 L960 155 L0 155 Z" fill="url(#song-han-far-bank)" fill-opacity="0.88" />
  <path d="M0 78 C210 38, 430 112, 680 72 C805 52, 900 72, 960 88" stroke="#FAF4E8" stroke-opacity="0.55" stroke-width="3" />

  <!-- Near riverbank shadow + sunlit embankment -->
  <path d="M0 342 C240 296, 500 374, 750 326 C845 308, 915 322, 960 336 L960 396 C885 384, 815 376, 735 390 C485 434, 235 362, 0 402 Z" fill="url(#song-han-near-bank)" />
  <path d="M0 398 C235 358, 485 430, 735 386 C815 372, 885 380, 960 392" stroke="#F6EFE4" stroke-opacity="0.52" stroke-width="3" />

  <!-- Main Han River water band -->
  <path d="M0 106 C210 66, 430 138, 680 98 C805 78, 900 98, 960 114 L960 344 C915 330, 845 316, 750 334 C500 382, 240 304, 0 350 Z" fill="url(#song-han-water)" />
  <path d="M0 106 C210 66, 430 138, 680 98 C805 78, 900 98, 960 114 L960 344 C915 330, 845 316, 750 334 C500 382, 240 304, 0 350 Z" fill="url(#song-han-ripple-pat)" />

  <!-- Soft shallow-water edge along far sunlit bank -->
  <path d="M0 114 C210 74, 430 146, 680 106 C805 86, 900 106, 960 122" stroke="#90C2D8" stroke-opacity="0.45" stroke-width="10" />

  <!-- Flowing current ribbons -->
  <path d="M-10 185 C220 148, 445 218, 695 178 C815 158, 905 176, 970 192" stroke="#9CD0E6" stroke-opacity="0.22" stroke-width="16" stroke-linecap="round" />
  <path d="M-10 258 C230 220, 470 292, 725 250 C835 232, 915 246, 970 260" stroke="#75AECC" stroke-opacity="0.2" stroke-width="22" stroke-linecap="round" />

  <!-- Sun glint highlights across the water -->
  <rect x="115" y="152" width="145" height="6" rx="3" fill="url(#song-han-glint)" />
  <rect x="175" y="168" width="90" height="4" rx="2" fill="url(#song-han-glint)" />
  <rect x="370" y="214" width="165" height="7" rx="3.5" fill="url(#song-han-glint)" />
  <rect x="420" y="232" width="95" height="4" rx="2" fill="url(#song-han-glint)" />
  <rect x="650" y="156" width="150" height="6" rx="3" fill="url(#song-han-glint)" />
  <rect x="785" y="268" width="110" height="5" rx="2.5" fill="url(#song-han-glint)" />

  <!-- Tiny sunlit sparkle diamonds -->
  <g fill="#FFF9EB" fill-opacity="0.82">
    <polygon points="210,144 215,152 210,160 205,152" />
    <polygon points="455,204 461,214 455,224 449,214" />
    <polygon points="735,148 740,156 735,164 730,156" />
  </g>
</svg>
