<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="tuong-da-marble" x1="0" y1="80" x2="0" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F7F1E6" />
      <stop offset="65%" stop-color="#DFD3C1" />
      <stop offset="100%" stop-color="#BFB09B" />
    </linearGradient>
    <linearGradient id="tuong-da-raw" x1="0" y1="180" x2="0" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C9BEB0" />
      <stop offset="100%" stop-color="#8F8273" />
    </linearGradient>
  </defs>

  <!-- Khoi da tho ben trai -->
  <g>
    <polygon points="40,390 65,248 165,216 258,242 290,390" fill="url(#tuong-da-raw)" />
    <polygon points="165,216 258,242 232,390 155,390" fill="#A6998A" />
    <!-- Khoi da vuong dang deo -->
    <rect x="225" y="286" width="142" height="104" rx="4" fill="#E5DAC9" />
    <rect x="330" y="286" width="37" height="104" rx="2" fill="#C4B6A3" />
    <!-- Bua go va duc sat tren khoi da -->
    <rect x="258" y="274" width="68" height="10" rx="4" transform="rotate(-10 258 274)" fill="#8B5A33" />
    <rect x="308" y="256" width="26" height="36" rx="4" transform="rotate(-10 308 256)" fill="#6E4427" />
    <rect x="246" y="280" width="44" height="6" rx="2" fill="#6F7780" />
  </g>

  <!-- Tuong ky lan / su tu da Non Nuoc o trung tam-phai -->
  <g>
    <!-- Be da cham khac -->
    <rect x="650" y="328" width="240" height="62" rx="4" fill="#B5A693" />
    <rect x="666" y="314" width="208" height="18" rx="3" fill="#DDD0BE" />
    <!-- Than tuong da cam thach trang nga -->
    <path
      d="M708 314 C698 272, 708 228, 742 204 C732 184, 738 152, 768 142 C798 134, 826 154, 830 184 C854 198, 864 236, 852 278 L845 314 Z"
      fill="url(#tuong-da-marble)"
    />
    <!-- Bom toc xoan va chi tiet cham noi -->
    <circle cx="755" cy="172" r="14" fill="#E8DEC9" />
    <circle cx="785" cy="162" r="15" fill="#EDE4D3" />
    <circle cx="812" cy="176" r="13" fill="#DFD3C1" />
    <path d="M748 226 C770 218, 804 222, 822 240" stroke="#BFB09B" stroke-width="5" stroke-linecap="round" />
    <path d="M736 266 C764 256, 802 260, 828 276" stroke="#BFB09B" stroke-width="5" stroke-linecap="round" />
  </g>

  <!-- Den da san vuon nho ben phai -->
  <g>
    <rect x="965" y="348" width="110" height="42" rx="3" fill="#B5A693" />
    <rect x="998" y="268" width="44" height="80" fill="#DDD0BE" />
    <rect x="984" y="220" width="72" height="50" rx="4" fill="#EFE6D8" />
    <rect x="1004" y="232" width="32" height="26" rx="2" fill="#E6A13C" fill-opacity="0.75" />
    <polygon points="962,222 1020,178 1078,222" fill="#C4B6A3" />
    <circle cx="1020" cy="172" r="9" fill="#DDD0BE" />
  </g>

  <!-- Mat dat cat da -->
  <rect x="0" y="386" width="1200" height="14" fill="#9E7E58" />
</svg>
