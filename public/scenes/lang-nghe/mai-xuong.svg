<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 400" fill="none">
  <defs>
    <linearGradient id="mai-xuong-tile" x1="600" y1="120" x2="600" y2="255" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C86843" />
      <stop offset="100%" stop-color="#8C3E24" />
    </linearGradient>
    <linearGradient id="mai-xuong-wall" x1="600" y1="220" x2="600" y2="390" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E6C99C" />
      <stop offset="100%" stop-color="#C9A372" />
    </linearGradient>
  </defs>

  <!-- Xuong da ben trai -->
  <g>
    <rect x="75" y="232" width="380" height="152" fill="url(#mai-xuong-wall)" />
    <!-- Khoang mo ben trong xuong -->
    <rect x="115" y="256" width="130" height="128" fill="#4A3426" />
    <rect x="275" y="256" width="140" height="128" fill="#4A3426" />
    <!-- Cot go -->
    <rect x="92" y="232" width="16" height="152" fill="#6E4427" />
    <rect x="252" y="232" width="16" height="152" fill="#6E4427" />
    <rect x="422" y="232" width="16" height="152" fill="#6E4427" />
    <!-- Mai ngoi am duong -->
    <polygon points="48,236 125,146 410,146 485,236" fill="url(#mai-xuong-tile)" />
    <rect x="48" y="226" width="437" height="12" rx="3" fill="#73321C" />
    <!-- Song ngoi -->
    <path d="M100 226 L150 146 M160 226 L195 146 M220 226 L245 146 M280 226 L295 146 M340 226 L345 146 M400 226 L395 146" stroke="#73321C" stroke-opacity="0.45" stroke-width="3" />
    <!-- Noc mai -->
    <rect x="122" y="140" width="290" height="10" rx="4" fill="#A64B2A" />
  </g>

  <!-- Xuong da chinh ben phai -->
  <g>
    <rect x="595" y="210" width="520" height="174" fill="url(#mai-xuong-wall)" />
    <!-- Khoang xuong mo -->
    <rect x="640" y="238" width="175" height="146" fill="#4A3426" />
    <rect x="855" y="238" width="215" height="146" fill="#4A3426" />
    <!-- Cot go -->
    <rect x="615" y="210" width="18" height="174" fill="#6E4427" />
    <rect x="826" y="210" width="18" height="174" fill="#6E4427" />
    <rect x="1078" y="210" width="18" height="174" fill="#6E4427" />
    <!-- Mai ngoi rong -->
    <polygon points="560,214 660,112 1055,112 1150,214" fill="url(#mai-xuong-tile)" />
    <rect x="560" y="204" width="590" height="13" rx="3" fill="#73321C" />
    <path d="M625 204 L695 112 M700 204 L750 112 M775 204 L810 112 M850 204 L868 112 M925 204 L928 112 M1000 204 L988 112 M1075 204 L1045 112" stroke="#73321C" stroke-opacity="0.45" stroke-width="3" />
    <rect x="656" y="106" width="404" height="10" rx="4" fill="#A64B2A" />
  </g>

  <!-- Nen san xuong am -->
  <rect x="0" y="382" width="1200" height="18" fill="#B5895A" />
</svg>
