<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 360" fill="none">
  <defs>
    <linearGradient id="san-choi-earth" x1="480" y1="40" x2="480" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#3E322C" />
      <stop offset="45%" stop-color="#271F1B" />
      <stop offset="100%" stop-color="#14100E" />
    </linearGradient>
    <radialGradient id="san-choi-glow" cx="0.5" cy="0.46" r="0.48">
      <stop offset="0%" stop-color="#F7D277" stop-opacity="0.45" />
      <stop offset="45%" stop-color="#C98A2E" stop-opacity="0.22" />
      <stop offset="100%" stop-color="#A84825" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="san-choi-stage-top" x1="340" y1="90" x2="620" y2="195" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#E7B76E" />
      <stop offset="55%" stop-color="#B97B3C" />
      <stop offset="100%" stop-color="#875022" />
    </linearGradient>
    <linearGradient id="san-choi-mat" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#F2E2C4" />
      <stop offset="60%" stop-color="#D7BE92" />
      <stop offset="100%" stop-color="#A98B5A" />
    </linearGradient>
    <pattern id="san-choi-weave-pat" width="12" height="12" patternUnits="userSpaceOnUse">
      <path d="M0 4 H12 M0 10 H12 M6 0 V12" stroke="#7A5A32" stroke-opacity="0.18" stroke-width="1" />
    </pattern>
  </defs>

  <!-- Night village courtyard earth floor -->
  <path d="M0 78 C240 42, 720 42, 960 78 L960 360 L0 360 Z" fill="url(#san-choi-earth)" />
  <path d="M0 78 C240 42, 720 42, 960 78" stroke="#6B7E8C" stroke-opacity="0.32" stroke-width="2.5" />

  <!-- Warm lantern/stage light pool radiating across the yard -->
  <ellipse cx="480" cy="185" rx="410" ry="118" fill="url(#san-choi-glow)" />

  <!-- Central raised wooden host stage (bục xướng) -->
  <g>
    <!-- Soft cast shadow behind-right -->
    <polygon points="348,176 628,176 664,202 332,202" fill="#0F0B09" fill-opacity="0.58" />
    <!-- Stage front apron / skirt (shaded wood) -->
    <polygon points="334,158 626,158 634,188 326,188" fill="#5A3317" />
    <rect x="366" y="164" width="228" height="18" rx="3" fill="#7D361A" />
    <!-- Lit timber stage top platform -->
    <polygon points="362,102 598,102 626,158 334,158" fill="url(#san-choi-stage-top)" />
    <polygon points="362,102 598,102 626,158 334,158" fill="url(#san-choi-weave-pat)" />
    <!-- Warm front edge rim highlight -->
    <line x1="334" y1="158" x2="626" y2="158" stroke="#FCE5B2" stroke-opacity="0.72" stroke-width="3" />
    <!-- Host lectern / card table glow on stage -->
    <rect x="448" y="108" width="64" height="24" rx="3" fill="#702E14" />
    <rect x="454" y="104" width="52" height="10" rx="2" fill="#E6B85C" />
  </g>

  <!-- Left woven straw mat (chiếu cói) -->
  <g>
    <polygon points="108,166 294,158 268,262 62,272" fill="#0F0B09" fill-opacity="0.38" transform="translate(8 8)" />
    <polygon points="108,166 294,158 268,262 62,272" fill="url(#san-choi-mat)" />
    <polygon points="108,166 294,158 268,262 62,272" fill="url(#san-choi-weave-pat)" />
    <line x1="94" y1="198" x2="280" y2="190" stroke="#A84825" stroke-opacity="0.72" stroke-width="5" />
    <line x1="80" y1="230" x2="272" y2="222" stroke="#A84825" stroke-opacity="0.72" stroke-width="5" />
  </g>

  <!-- Center-front ceremonial reed mat (chiếu hoa) -->
  <g>
    <polygon points="362,208 598,208 632,318 328,318" fill="#0F0B09" fill-opacity="0.42" transform="translate(8 9)" />
    <polygon points="362,208 598,208 632,318 328,318" fill="url(#san-choi-mat)" />
    <polygon points="362,208 598,208 632,318 328,318" fill="url(#san-choi-weave-pat)" />
    <line x1="352" y1="238" x2="608" y2="238" stroke="#A84825" stroke-opacity="0.78" stroke-width="6" />
    <line x1="340" y1="282" x2="620" y2="282" stroke="#A84825" stroke-opacity="0.78" stroke-width="6" />
    <polygon points="480,236 520,260 480,284 440,260" fill="#B54D28" fill-opacity="0.72" />
  </g>

  <!-- Right woven straw mat -->
  <g>
    <polygon points="666,158 852,166 898,272 692,262" fill="#0F0B09" fill-opacity="0.38" transform="translate(8 8)" />
    <polygon points="666,158 852,166 898,272 692,262" fill="url(#san-choi-mat)" />
    <polygon points="666,158 852,166 898,272 692,262" fill="url(#san-choi-weave-pat)" />
    <line x1="680" y1="190" x2="866" y2="198" stroke="#A84825" stroke-opacity="0.72" stroke-width="5" />
    <line x1="688" y1="222" x2="880" y2="230" stroke="#A84825" stroke-opacity="0.72" stroke-width="5" />
  </g>
</svg>
