<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" fill="none">
  <defs>
    <linearGradient id="yardGround" x1="480" y1="40" x2="480" y2="320" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#5E5148" />
      <stop offset="100%" stop-color="#1F1A17" />
    </linearGradient>
  </defs>
  <!-- Village courtyard earth floor -->
  <path
    d="M0 70 C240 35, 720 35, 960 70 L960 320 L0 320 Z"
    fill="url(#yardGround)"
  />
  <!-- Warm lantern light pool in the middle of the yard -->
  <ellipse cx="480" cy="175" rx="370" ry="85" fill="#C99A2E" fill-opacity="0.22" />

  <!-- Left woven reed mat (chieu coi) in perspective -->
  <g>
    <polygon points="150,130 350,122 325,215 95,225" fill="#F6EFE4" fill-opacity="0.85" />
    <polygon points="156,136 342,128 319,207 105,217" fill="#C99A2E" fill-opacity="0.38" />
    <line x1="138" y1="162" x2="334" y2="154" stroke="#A84825" stroke-width="6" stroke-opacity="0.75" />
    <line x1="122" y1="190" x2="326" y2="182" stroke="#A84825" stroke-width="6" stroke-opacity="0.75" />
  </g>

  <!-- Center main woven reed mat (chieu hoa) -->
  <g>
    <polygon points="385,142 575,142 605,252 355,252" fill="#F6EFE4" fill-opacity="0.9" />
    <polygon points="393,150 567,150 594,242 366,242" fill="#C99A2E" fill-opacity="0.42" />
    <line x1="378" y1="180" x2="582" y2="180" stroke="#A84825" stroke-width="7" stroke-opacity="0.8" />
    <line x1="368" y1="214" x2="592" y2="214" stroke="#A84825" stroke-width="7" stroke-opacity="0.8" />
    <polygon points="480,164 514,196 480,228 446,196" fill="#A84825" fill-opacity="0.65" />
  </g>

  <!-- Right woven reed mat -->
  <g>
    <polygon points="610,122 810,130 865,225 635,215" fill="#F6EFE4" fill-opacity="0.85" />
    <polygon points="618,128 804,136 855,217 641,207" fill="#C99A2E" fill-opacity="0.38" />
    <line x1="626" y1="154" x2="822" y2="162" stroke="#A84825" stroke-width="6" stroke-opacity="0.75" />
    <line x1="634" y1="182" x2="838" y2="190" stroke="#A84825" stroke-width="6" stroke-opacity="0.75" />
  </g>
</svg>
