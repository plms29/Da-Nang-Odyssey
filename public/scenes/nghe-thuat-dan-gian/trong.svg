<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 720" fill="none">
  <defs>
    <linearGradient id="drumBody" x1="220" y1="180" x2="740" y2="540" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C85A30" />
      <stop offset="50%" stop-color="#A84825" />
      <stop offset="100%" stop-color="#6B2811" />
    </linearGradient>
    <linearGradient id="drumHead" x1="300" y1="120" x2="660" y2="310" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6EFE4" />
      <stop offset="100%" stop-color="#D9C29C" />
    </linearGradient>
  </defs>

  <!-- Ground shadow under the drum stand -->
  <ellipse cx="480" cy="635" rx="340" ry="48" fill="#1F1A17" fill-opacity="0.55" />

  <!-- Crossed wooden drum stand (bronze/wood legs) -->
  <path d="M235 630 L395 360 L445 360 L295 630 Z" fill="#5E5148" stroke="#1F1A17" stroke-width="8" />
  <path d="M725 630 L565 360 L515 360 L665 630 Z" fill="#5E5148" stroke="#1F1A17" stroke-width="8" />
  <rect x="275" y="515" width="410" height="28" rx="8" fill="#C99A2E" stroke="#1F1A17" stroke-width="6" />

  <!-- Barrel-shaped Bai Choi festival drum body (terracotta lacquered wood) -->
  <path
    d="M275 215 C215 330, 215 445, 295 545 C395 595, 565 595, 665 545 C745 445, 745 330, 685 215 Z"
    fill="url(#drumBody)"
    stroke="#1F1A17"
    stroke-width="10"
  />
  <!-- Decorative gold band around the drum waist -->
  <path
    d="M242 385 C385 432, 575 432, 718 385 L714 420 C575 466, 385 466, 246 420 Z"
    fill="#C99A2E"
  />

  <!-- Top stretched leather drumhead -->
  <ellipse cx="480" cy="215" rx="205" ry="76" fill="url(#drumHead)" stroke="#C99A2E" stroke-width="12" />
  <!-- Traditional concentric sun/lotus ring painted on the drumhead -->
  <ellipse cx="480" cy="215" rx="115" ry="42" stroke="#A84825" stroke-width="8" stroke-opacity="0.7" />
  <ellipse cx="480" cy="215" rx="46" ry="18" fill="#A84825" fill-opacity="0.85" />

  <!-- Bronze tack studs around top rim -->
  <g fill="#C99A2E">
    <circle cx="305" cy="260" r="8" />
    <circle cx="355" cy="280" r="8" />
    <circle cx="415" cy="294" r="8" />
    <circle cx="480" cy="298" r="8" />
    <circle cx="545" cy="294" r="8" />
    <circle cx="605" cy="280" r="8" />
    <circle cx="655" cy="260" r="8" />
  </g>

  <!-- Pair of wooden drumsticks resting across the top -->
  <g>
    <line x1="330" y1="145" x2="555" y2="235" stroke="#5E5148" stroke-width="16" stroke-linecap="round" />
    <circle cx="562" cy="238" r="18" fill="#A84825" />
    <line x1="630" y1="150" x2="415" y2="242" stroke="#5E5148" stroke-width="16" stroke-linecap="round" />
    <circle cx="408" cy="245" r="18" fill="#A84825" />
  </g>
</svg>
