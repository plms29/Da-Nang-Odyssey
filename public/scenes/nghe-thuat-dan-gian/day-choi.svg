<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 420" fill="none">
  <defs>
    <linearGradient id="hutGlow" x1="480" y1="120" x2="480" y2="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#F6EFE4" />
      <stop offset="45%" stop-color="#C99A2E" />
      <stop offset="100%" stop-color="#A84825" />
    </linearGradient>
    <linearGradient id="thatchRoof" x1="480" y1="80" x2="480" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#C99A2E" />
      <stop offset="100%" stop-color="#5E5148" />
    </linearGradient>
  </defs>

  <!-- Night foliage silhouette behind the arc of 5 raised Bai Choi bamboo huts -->
  <path
    d="M0 340 C130 275, 290 250, 480 245 C670 250, 830 275, 960 340 L960 420 L0 420 Z"
    fill="#1F1A17"
    fill-opacity="0.78"
  />

  <!-- Festive string line connecting the 5 huts -->
  <path
    d="M80 185 Q270 155 480 135 Q690 155 880 185"
    stroke="#C99A2E"
    stroke-width="3"
    stroke-opacity="0.65"
  />

  <!-- HUT 1 (far left) -->
  <g transform="translate(38, 175)">
    <!-- Bamboo stilts + ladder -->
    <rect x="24" y="105" width="8" height="95" fill="#5E5148" />
    <rect x="108" y="105" width="8" height="95" fill="#5E5148" />
    <line x1="28" y1="145" x2="112" y2="145" stroke="#C99A2E" stroke-width="4" />
    <!-- Warm golden interior -->
    <rect x="22" y="48" width="96" height="60" rx="3" fill="url(#hutGlow)" />
    <!-- Bamboo balustrade -->
    <rect x="18" y="88" width="104" height="20" fill="#5E5148" />
    <!-- Thatched gable roof -->
    <polygon points="4,52 70,8 136,52" fill="url(#thatchRoof)" />
  </g>

  <!-- HUT 2 (mid left) -->
  <g transform="translate(216, 142)">
    <rect x="26" y="112" width="8" height="105" fill="#5E5148" />
    <rect x="116" y="112" width="8" height="105" fill="#5E5148" />
    <line x1="30" y1="155" x2="120" y2="155" stroke="#C99A2E" stroke-width="4" />
    <rect x="24" y="52" width="102" height="64" rx="3" fill="url(#hutGlow)" />
    <rect x="20" y="94" width="110" height="22" fill="#5E5148" />
    <polygon points="4,56 75,8 146,56" fill="url(#thatchRoof)" />
  </g>

  <!-- HUT 3 (center main hut - slightly higher in the arc) -->
  <g transform="translate(398, 118)">
    <rect x="28" y="122" width="10" height="115" fill="#5E5148" />
    <rect x="126" y="122" width="10" height="115" fill="#5E5148" />
    <line x1="33" y1="168" x2="131" y2="168" stroke="#C99A2E" stroke-width="5" />
    <line x1="58" y1="122" x2="50" y2="235" stroke="#C99A2E" stroke-width="4" />
    <line x1="106" y1="122" x2="114" y2="235" stroke="#C99A2E" stroke-width="4" />
    <rect x="26" y="56" width="112" height="70" rx="4" fill="url(#hutGlow)" />
    <rect x="22" y="102" width="120" height="24" fill="#A84825" />
    <polygon points="4,60 82,6 160,60" fill="url(#thatchRoof)" />
  </g>

  <!-- HUT 4 (mid right) -->
  <g transform="translate(594, 142)">
    <rect x="26" y="112" width="8" height="105" fill="#5E5148" />
    <rect x="116" y="112" width="8" height="105" fill="#5E5148" />
    <line x1="30" y1="155" x2="120" y2="155" stroke="#C99A2E" stroke-width="4" />
    <rect x="24" y="52" width="102" height="64" rx="3" fill="url(#hutGlow)" />
    <rect x="20" y="94" width="110" height="22" fill="#5E5148" />
    <polygon points="4,56 75,8 146,56" fill="url(#thatchRoof)" />
  </g>

  <!-- HUT 5 (far right) -->
  <g transform="translate(782, 175)">
    <rect x="24" y="105" width="8" height="95" fill="#5E5148" />
    <rect x="108" y="105" width="8" height="95" fill="#5E5148" />
    <line x1="28" y1="145" x2="112" y2="145" stroke="#C99A2E" stroke-width="4" />
    <rect x="22" y="48" width="96" height="60" rx="3" fill="url(#hutGlow)" />
    <rect x="18" y="88" width="104" height="20" fill="#5E5148" />
    <polygon points="4,52 70,8 136,52" fill="url(#thatchRoof)" />
  </g>
</svg>
