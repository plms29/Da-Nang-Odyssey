      <stop offset="48%" stop-color="#C98A2E" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#A84825" stop-opacity="0" />
    </radialGradient>
    <radialGradient id="day-choi-window" cx="0.5" cy="0.55" r="0.55">
