<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1120" fill="none">
  <defs>
    <linearGradient id="lanternSilk1" x1="480" y1="180" x2="480" y2="680" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D96B38" />
      <stop offset="45%" stop-color="#A84825" />
      <stop offset="100%" stop-color="#702810" />
    </linearGradient>
    <radialGradient id="lanternCore1" cx="0.5" cy="0.48" r="0.48">
      <stop offset="0%" stop-color="#F6EFE4" stop-opacity="0.92" />
      <stop offset="45%" stop-color="#C99A2E" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#A84825" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Soft outer night halo -->
  <circle cx="480" cy="435" r="390" fill="#C99A2E" fill-opacity="0.18" />

  <!-- Hanging cord anchored at top-center (x=480, y=0) for animate="sway" -->
  <rect x="468" y="0" width="24" height="165" fill="#C99A2E" />
  <circle cx="480" cy="95" r="26" fill="#A84825" stroke="#C99A2E" stroke-width="8" />

  <!-- Upper wooden/gold collar -->
  <rect x="355" y="152" width="250" height="38" rx="12" fill="#1F1A17" stroke="#C99A2E" stroke-width="8" />

  <!-- Traditional diamond/garlic-bulb Hoi An / Bai Choi silk lantern body -->
  <path
    d="M355 186 C155 270, 135 450, 365 660 L595 660 C825 450, 805 270, 605 186 Z"
    fill="url(#lanternSilk1)"
  />
  <!-- Inner warm candle glow -->
  <ellipse cx="480" cy="420" rx="235" ry="205" fill="url(#lanternCore1)" />

  <!-- Curved bamboo ribs -->
  <path
    d="M395 186 C265 280, 255 455, 405 660 M565 186 C695 280, 705 455, 555 660 M480 186 L480 660"
    stroke="#1F1A17"
    stroke-width="10"
    stroke-opacity="0.45"
  />

  <!-- Lower wooden/gold collar -->
  <rect x="365" y="652" width="230" height="36" rx="10" fill="#1F1A17" stroke="#C99A2E" stroke-width="8" />

  <!-- Gold silk tassel knot & flowing fringe -->
  <line x1="480" y1="688" x2="480" y2="755" stroke="#C99A2E" stroke-width="16" />
  <circle cx="480" cy="755" r="28" fill="#A84825" stroke="#C99A2E" stroke-width="8" />
  <path
    d="M452 775 L415 1045 L545 1045 L508 775 Z"
    fill="#C99A2E"
  />
  <line x1="458" y1="785" x2="442" y2="1045" stroke="#A84825" stroke-width="6" stroke-opacity="0.55" />
  <line x1="480" y1="785" x2="480" y2="1045" stroke="#A84825" stroke-width="6" stroke-opacity="0.55" />
  <line x1="502" y1="785" x2="518" y2="1045" stroke="#A84825" stroke-width="6" stroke-opacity="0.55" />
</svg>
