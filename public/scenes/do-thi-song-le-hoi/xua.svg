<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 625" width="1000" height="625" role="img" aria-labelledby="xua-title xua-desc">
  <title id="xua-title">Bờ sông Hàn ngày xưa</title>
  <desc id="xua-desc">Tranh vẽ tay phong cách phẳng, ấm mô tả bờ sông Hàn ngày xưa với dòng sông rộng, núi Sơn Trà xa xa, nhà thấp mái ngói, cây dừa và thuyền gỗ nhỏ.</desc>
  <defs>
    <linearGradient id="xua-sky-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FDF4E3" />
      <stop offset="55%" stop-color="#F7DFBA" />
      <stop offset="100%" stop-color="#F0C38E" />
    </linearGradient>
    <radialGradient id="xua-sun-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFE6A3" stop-opacity="0.95" />
      <stop offset="60%" stop-color="#F6C46D" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#F6C46D" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="xua-river-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4A819E" />
      <stop offset="45%" stop-color="#2B6382" />
      <stop offset="100%" stop-color="#1D4A66" />
    </linearGradient>
    <linearGradient id="xua-bank-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#E8D3B0" />
      <stop offset="100%" stop-color="#D2B488" />
    </linearGradient>
    <linearGradient id="xua-grass-grad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#879C63" />
      <stop offset="100%" stop-color="#6B824B" />
    </linearGradient>
  </defs>

  <!-- Bầu trời ấm áp -->
  <rect id="xua-sky" x="0" y="0" width="1000" height="260" fill="url(#xua-sky-grad)" />
  <circle id="xua-sun-halo" cx="170" cy="92" r="76" fill="url(#xua-sun-glow)" />
  <circle id="xua-sun" cx="170" cy="92" r="36" fill="#FCE094" />

  <!-- Mây phẳng nhẹ nhàng -->
  <g id="xua-clouds" fill="#FFF9EE" opacity="0.72">
    <path d="M270 74 Q282 54 306 58 Q322 44 344 56 Q362 56 368 74 Z" />
    <path d="M700 88 Q714 70 738 74 Q756 60 778 72 Q796 72 802 88 Z" />
    <path d="M858 54 Q868 42 884 45 Q896 36 912 44 Q924 46 926 54 Z" />
  </g>

  <!-- Núi Sơn Trà xa xa -->
  <g id="xua-mountains">
    <!-- Dãy núi mờ phía tây-trung tâm, giữ thấp ở giữa -->
    <path d="M0 242 L0 198 Q70 176 145 196 Q220 210 295 194 Q365 182 435 204 Q515 218 595 198 L650 242 Z" fill="#A7B8AC" />
    <!-- Bán đảo Sơn Trà bên phải -->
    <path d="M565 242 Q635 194 705 182 Q768 150 835 130 Q895 148 945 142 Q978 148 1000 162 L1000 242 Z" fill="#7D968B" />
    <path d="M620 242 Q695 204 760 192 Q818 164 872 174 Q925 182 1000 192 L1000 242 Z" fill="#647F74" />
  </g>

  <!-- Bờ sông bên kia -->
  <rect id="xua-far-bank" x="0" y="236" width="1000" height="28" fill="#D5B488" />
  <rect id="xua-far-shore" x="0" y="258" width="1000" height="6" fill="#B68F5E" />

  <!-- Nhà thấp mái ngói và cây xanh bờ bên kia -->
  <g id="xua-far-village">
    <!-- Cụm cây xanh rải dọc bờ xa -->
    <g fill="#748D59">
      <circle cx="48" cy="236" r="16" />
      <circle cx="68" cy="238" r="13" />
      <circle cx="195" cy="238" r="14" />
      <circle cx="335" cy="236" r="15" />
      <circle cx="354" cy="239" r="12" />
      <circle cx="445" cy="239" r="13" />
      <circle cx="615" cy="238" r="14" />
      <circle cx="775" cy="237" r="15" />
      <circle cx="892" cy="236" r="15" />
    </g>

    <!-- Cụm nhà thấp mái ngói bên trái -->
    <g id="xua-far-houses-left">
      <rect x="86" y="234" width="34" height="18" fill="#F5EBDC" />
      <polygon points="82,235 103,221 124,235" fill="#A84825" />
      <rect x="99" y="241" width="7" height="11" fill="#5E4332" />

      <rect x="130" y="236" width="40" height="16" fill="#EDE0CA" />
      <polygon points="126,237 150,224 174,237" fill="#BC5832" />
      <rect x="146" y="242" width="7" height="10" fill="#5E4332" />

      <rect x="218" y="235" width="36" height="17" fill="#F5EBDC" />
      <polygon points="214,236 236,223 258,236" fill="#A84825" />
      <rect x="232" y="242" width="7" height="10" fill="#5E4332" />

      <rect x="268" y="237" width="44" height="15" fill="#EDE0CA" />
      <polygon points="264,238 290,225 316,238" fill="#C4623B" />
      <rect x="286" y="243" width="6" height="9" fill="#5E4332" />
    </g>

    <!-- Cụm nhà thấp mái ngói nhỏ ở giữa (vẫn giữ nguyên ở tranh nay) -->
    <g id="xua-far-houses-center">
      <rect x="466" y="238" width="28" height="14" fill="#F5EBDC" />
      <polygon points="463,239 480,228 497,239" fill="#A84825" />
      <rect x="504" y="237" width="32" height="15" fill="#EDE0CA" />
      <polygon points="501,238 520,227 539,238" fill="#BC5832" />
      <rect x="546" y="238" width="28" height="14" fill="#F5EBDC" />
      <polygon points="543,239 560,229 577,239" fill="#A84825" />
    </g>

    <!-- Cụm nhà thấp mái ngói bên phải -->
    <g id="xua-far-houses-right">
      <rect x="652" y="235" width="36" height="17" fill="#F5EBDC" />
      <polygon points="648,236 670,223 692,236" fill="#A84825" />
      <rect x="666" y="242" width="6" height="10" fill="#5E4332" />

      <rect x="700" y="236" width="38" height="16" fill="#EDE0CA" />
      <polygon points="696,237 719,224 742,237" fill="#BC5832" />

      <rect x="804" y="234" width="40" height="18" fill="#F5EBDC" />
      <polygon points="800,235 824,221 848,235" fill="#A84825" />
      <rect x="820" y="241" width="7" height="11" fill="#5E4332" />
    </g>

    <!-- Cây dừa bờ xa -->
    <g id="xua-far-palms">
      <path d="M56 248 Q62 222 52 198" stroke="#7A5236" stroke-width="4" fill="none" stroke-linecap="round" />
      <g fill="#567346">
        <path d="M52 198 Q36 190 26 202 Q40 198 52 198 Z" />
        <path d="M52 198 Q44 180 56 174 Q56 186 52 198 Z" />
        <path d="M52 198 Q68 184 78 196 Q64 196 52 198 Z" />
        <path d="M52 198 Q66 202 72 214 Q60 206 52 198 Z" />
      </g>

      <path d="M392 248 Q386 222 396 200" stroke="#7A5236" stroke-width="4" fill="none" stroke-linecap="round" />
      <g fill="#5E7B4D">
        <path d="M396 200 Q380 192 370 204 Q384 200 396 200 Z" />
        <path d="M396 200 Q392 182 404 176 Q400 188 396 200 Z" />
        <path d="M396 200 Q412 188 422 200 Q408 198 396 200 Z" />
        <path d="M396 200 Q410 204 414 216 Q402 208 396 200 Z" />
      </g>

      <path d="M936 248 Q930 220 942 196" stroke="#7A5236" stroke-width="4.5" fill="none" stroke-linecap="round" />
      <g fill="#567346">
        <path d="M942 196 Q924 188 914 200 Q928 196 942 196 Z" />
        <path d="M942 196 Q938 178 952 172 Q946 184 942 196 Z" />
        <path d="M942 196 Q960 184 970 196 Q956 194 942 196 Z" />
        <path d="M942 196 Q956 202 962 214 Q948 204 942 196 Z" />
      </g>
    </g>
  </g>

  <!-- Dòng sông Hàn rộng ở giữa-dưới -->
  <path id="xua-river" d="M0 264 L1000 264 L1000 546 Q820 542 620 534 Q390 524 210 492 Q95 470 0 458 Z" fill="url(#xua-river-grad)" />

  <!-- Ánh nắng phản chiếu và gợn sóng sông -->
  <g id="xua-water-ripples">
    <g fill="#F8D9A0" opacity="0.24">
      <rect x="135" y="282" width="76" height="4" rx="2" />
      <rect x="120" y="302" width="106" height="4" rx="2" />
      <rect x="145" y="324" width="68" height="4" rx="2" />
      <rect x="128" y="346" width="90" height="3.5" rx="1.75" />
    </g>
    <g stroke="#7CB0C9" stroke-width="2" stroke-linecap="round" opacity="0.35">
      <line x1="65" y1="382" x2="135" y2="382" />
      <line x1="470" y1="312" x2="545" y2="312" />
      <line x1="640" y1="418" x2="725" y2="418" />
      <line x1="295" y1="454" x2="365" y2="454" />
      <line x1="780" y1="494" x2="860" y2="494" />
      <line x1="485" y1="506" x2="545" y2="506" />
    </g>
  </g>

  <!-- Thuyền gỗ nhỏ trên sông -->
  <g id="xua-wooden-boats">
    <!-- Thuyền gỗ 1 -->
    <g id="xua-boat-1" transform="translate(415, 442)">
      <ellipse cx="0" cy="11" rx="34" ry="4" fill="#163950" opacity="0.35" />
      <path d="M-28 0 Q0 12 28 0 L22 9 Q0 16 -22 9 Z" fill="#7D4E2D" />
      <path d="M-28 0 Q0 7 28 0" stroke="#A66D42" stroke-width="2" fill="none" />
      <!-- Người chèo thuyền đội nón lá -->
      <rect x="7" y="-8" width="6" height="9" rx="2" fill="#4E6A7A" />
      <polygon points="3,-8 10,-15 17,-8" fill="#EBD6A7" />
      <line x1="11" y1="-2" x2="24" y2="12" stroke="#5E3A20" stroke-width="2" stroke-linecap="round" />
    </g>

    <!-- Thuyền gỗ 2 -->
    <g id="xua-boat-2" transform="translate(882, 458)">
      <ellipse cx="0" cy="10" rx="28" ry="3.5" fill="#163950" opacity="0.35" />
      <path d="M-23 0 Q0 10 23 0 L18 8 Q0 13 -18 8 Z" fill="#6F4426" />
      <path d="M-23 0 Q0 6 23 0" stroke="#99643B" stroke-width="1.8" fill="none" />
      <rect x="-10" y="-7" width="5" height="8" rx="2" fill="#A84825" />
      <polygon points="-14,-7 -7.5,-13 -1,-7" fill="#EBD6A7" />
      <line x1="-8" y1="-1" x2="-20" y2="11" stroke="#5E3A20" stroke-width="1.8" stroke-linecap="round" />
    </g>
  </g>

  <!-- Bờ gần (bờ sông Hàn phía gần người xem) -->
  <g id="xua-near-bank">
    <!-- Kè đá thấp ven nước -->
    <path d="M0 458 Q95 470 210 492 Q390 524 620 534 Q820 542 1000 546 L1000 562 Q820 558 620 550 Q390 540 210 508 Q95 486 0 474 Z" fill="#B99C79" />
    <!-- Mặt bờ đất cát ấm -->
    <path d="M0 474 Q95 486 210 508 Q390 540 620 550 Q820 558 1000 562 L1000 625 L0 625 Z" fill="url(#xua-bank-grad)" />
    <!-- Thảm cỏ ven bờ -->
    <path d="M0 540 Q140 538 280 564 Q470 595 700 584 Q860 576 1000 582 L1000 625 L0 625 Z" fill="url(#xua-grass-grad)" />

    <!-- Vài cọc gỗ neo thuyền nhỏ và bụi cỏ ven bờ trái -->
    <g id="xua-shore-details">
      <rect x="112" y="486" width="5" height="14" rx="1.5" fill="#6F472B" />
      <rect x="148" y="492" width="5" height="14" rx="1.5" fill="#6F472B" />
      <ellipse cx="76" cy="542" rx="18" ry="8" fill="#6B824B" />
      <ellipse cx="246" cy="566" rx="22" ry="9" fill="#778E55" />
      <ellipse cx="520" cy="592" rx="28" ry="10" fill="#6B824B" />
    </g>

    <!-- Nhà thấp mái ngói ở góc bờ gần bên phải -->
    <g id="xua-near-house" transform="translate(832, 514)">
      <rect x="10" y="28" width="96" height="44" rx="2" fill="#F6EFE4" />
      <rect x="10" y="28" width="96" height="6" fill="#E3D2BA" />
      <polygon points="0,30 58,0 116,30" fill="#A84825" />
      <polygon points="8,30 58,6 108,30" fill="#BD5732" />
      <rect x="46" y="44" width="22" height="28" rx="1" fill="#5E402E" />
      <rect x="20" y="44" width="14" height="14" rx="1" fill="#7A563E" />
      <rect x="82" y="44" width="14" height="14" rx="1" fill="#7A563E" />
    </g>

    <!-- Cây dừa bờ gần (trái và phải) -->
    <g id="xua-near-palms">
      <!-- Cây dừa trái sát mép -->
      <path d="M24 554 Q34 486 22 418" stroke="#784E32" stroke-width="9" fill="none" stroke-linecap="round" />
      <g fill="#4E6D40">
        <path d="M22 418 Q-4 402 -12 426 Q4 416 22 418 Z" />
        <path d="M22 418 Q10 384 30 374 Q24 398 22 418 Z" />
        <path d="M22 418 Q52 390 72 412 Q46 410 22 418 Z" />
        <path d="M22 418 Q56 420 68 446 Q42 430 22 418 Z" />
        <path d="M22 418 Q2 434 -6 456 Q12 434 22 418 Z" />
      </g>
      <circle cx="24" cy="422" r="4" fill="#6D4B28" />
      <circle cx="17" cy="423" r="4" fill="#6D4B28" />

      <!-- Cụm cây dừa bên phải -->
      <path d="M956 592 Q942 518 960 448" stroke="#784E32" stroke-width="10" fill="none" stroke-linecap="round" />
      <g fill="#4E6D40">
        <path d="M960 448 Q926 432 908 456 Q936 446 960 448 Z" />
        <path d="M960 448 Q946 412 968 402 Q962 426 960 448 Z" />
        <path d="M960 448 Q992 420 1012 442 Q986 440 960 448 Z" />
        <path d="M960 448 Q992 454 1004 478 Q978 462 960 448 Z" />
        <path d="M960 448 Q934 466 922 488 Q946 466 960 448 Z" />
      </g>
      <circle cx="956" cy="453" r="4.5" fill="#6D4B28" />
      <circle cx="964" cy="454" r="4.5" fill="#6D4B28" />
    </g>
  </g>
</svg>
