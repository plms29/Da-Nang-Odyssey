<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 320" fill="none">
  <defs>
    <linearGradient id="sandstoneBlock" x1="480" y1="60" x2="480" y2="300" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#D9B37C" />
      <stop offset="50%" stop-color="#C99A2E" />
      <stop offset="100%" stop-color="#8A6236" />
    </linearGradient>
  </defs>
  <!-- Stepped sandstone pedestal base -->
  <rect x="110" y="250" width="740" height="50" rx="4" fill="#5E5148" />
  <rect x="150" y="224" width="660" height="30" rx="3" fill="#8A6236" />
  <!-- Main carved sandstone altar block -->
  <rect x="190" y="108" width="580" height="120" rx="4" fill="url(#sandstoneBlock)" />
  <!-- Upper & lower carved molding bands -->
  <rect x="176" y="94" width="608" height="18" rx="3" fill="#F6EFE4" fill-opacity="0.82" />
  <rect x="182" y="112" width="596" height="8" fill="#A84825" fill-opacity="0.65" />
  <rect x="182" y="212" width="596" height="12" fill="#5E5148" fill-opacity="0.75" />

  <!-- Carved lotus petal frieze along center band -->
  <g fill="#A84825" fill-opacity="0.78">
    <!-- Central lotus medallion -->
    <path d="M480 126 C496 146, 496 176, 480 198 C464 176, 464 146, 480 126 Z" />
    <path d="M480 134 C512 148, 518 178, 486 198 C492 174, 490 152, 480 134 Z" />
    <path d="M480 134 C448 148, 442 178, 474 198 C468 174, 470 152, 480 134 Z" />
    <!-- Flanking carved relief panels -->
    <rect x="235" y="138" width="90" height="56" rx="4" />
    <rect x="350" y="138" width="70" height="56" rx="4" />
    <rect x="540" y="138" width="70" height="56" rx="4" />
    <rect x="635" y="138" width="90" height="56" rx="4" />
  </g>
  <!-- Inner sandstone highlights inside side panels -->
  <g fill="#F6EFE4" fill-opacity="0.55">
    <polygon points="280,146 305,166 280,186 255,166" />
    <polygon points="385,148 404,166 385,184 366,166" />
    <polygon points="575,148 594,166 575,184 556,166" />
    <polygon points="680,146 705,166 680,186 655,166" />
  </g>
</svg>
